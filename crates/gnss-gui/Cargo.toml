[package]
name = "gnss-gui"
version = "0.1.0"
edition = "2021"
description = "GNSScope GUI application using GPUI Kit"

[dependencies]
gnss-core = { path = "../gnss-core" }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
# Single facade over GPUI (gpui-pre), gpui-base, gpui-component, and the
# default asset bundle. Import paths use `gpui_kit::` and
# `gpui_kit::component::` instead of `gpui::` / `gpui_component::`.
gpui-kit = "0.7.1"
num-complex = "0.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real system telemetry for the status strip's right segment (design-refresh
# spec §3.11 / issue 16): CPU, memory and disk usage percentages must come
# from platform APIs. Pure `std` cannot read them on macOS/Windows (mach
# host_statistics / GlobalMemoryStatusEx / statvfs are all outside std), and
# spawning per-interval helper processes is forbidden by the issue. `sysinfo`
# is the small crate the ticket names as the acceptable option; justification
# recorded in .scratch/ui-visual-refactor/issues/16-status-title.md under
# ## Comments. Pinned to the 0.31 line already in Cargo.lock (via zed-scap)
# so the dependency unifies to a single compiled copy; only the `system`
# (CPU/memory) and `disk` (volume usage) components are requested.
sysinfo = { version = "0.31", default-features = false, features = [
    "disk",
    "system",
] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# TestAppContext uses no native Metal renderer; keep tests/lints independent of
# the optional offline Xcode Metal toolchain. Production dependency stays above.
# gpui-pre 0.3.8 no longer exposes the old `runtime_shaders` feature; shader
# handling is covered by gpui-kit itself.
gpui-kit = { version = "0.7.1", features = ["test-support"] }
# Save headless pixel-capture evidence; pinned to the same minor as gpui's tree.
image = "0.25"
